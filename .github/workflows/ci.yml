name: CI/CD - democyber

# Déclenché sur push ou pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # 1. Récupération du code (historique complet pour Gitleaks et SonarCloud)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. TP2 - Détection de secrets (avant compilation)
      - name: Run Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rapport Gitleaks (exécuté même si des secrets sont détectés)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      # 3. TP1 - Java, compilation, tests
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Java
        run: mvn -B compile

      - name: Build and test with Maven
        run: mvn -B clean verify

      # 4. TP3 - Analyse SonarCloud (nécessite les secrets Sonar)
      - name: SonarCloud Scan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # 5. TP1 / TP2 - Docker : login, build, test
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t democyber:latest -t $DOCKER_IMAGE_NAME .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 democyber:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application OK"; break
            fi
            sleep 2
          done
          curl -f http://localhost:8080
          docker stop democyber-test
          docker rm democyber-test

      # 6. TP2 - Analyse Trivy
      # Rapport JSON (ne fait pas échouer) -> artifact
      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: democyber:latest
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

      # Contrôle bloquant : échoue si vulnérabilité CRITICAL ou HIGH
      - name: Trivy scan (quality gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: democyber:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 7. Publication sur Docker Hub (uniquement sur main, après tous les contrôles)
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push $DOCKER_IMAGE_NAME
