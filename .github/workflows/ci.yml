name: CI/CD - democyber

# Déclenché sur push ou pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code (historique complet pour Gitleaks et SonarCloud)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. TP2 - Détection de secrets (avant compilation)
      - name: Run Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rapport Gitleaks (exécuté même si des secrets sont détectés)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      # 3. TP1 - Java, compilation, tests
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Java
        run: mvn -B compile

      - name: Build and test with Maven
        run: mvn -B clean verify

      # 4. TP3 - Analyse SonarCloud (ignorée tant que le secret n'est pas créé)
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN absent : analyse SonarCloud ignoree jusqu'a la creation du secret."
            exit 0
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"

      # 5. TP1 / TP2 - Docker : login, build, test
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Secrets Docker Hub absents : login ignore."
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t democyber:latest .
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            docker tag democyber:latest "$DOCKERHUB_USERNAME/democyber:latest"
          fi

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 democyber:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application OK"; break
            fi
            sleep 2
          done
          curl -f http://localhost:8080
          docker stop democyber-test
          docker rm democyber-test

      # 6. TP2 - Analyse Trivy
      # Rapport JSON (ne fait pas échouer) -> artifact
      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: democyber:latest
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

      # Contrôle bloquant : échoue si vulnérabilité CRITICAL ou HIGH
      - name: Trivy scan (quality gate)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: democyber:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 7. Publication sur Docker Hub (uniquement sur main, après tous les contrôles)
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Secrets Docker Hub absents : push ignore."
            exit 0
          fi
          docker push "$DOCKERHUB_USERNAME/democyber:latest"
